[versions]
kotlin = "2.4.10"
kotlin-logging = "8.0.4"
kotlinx-coroutines = "1.11.0"
kover = "0.9.9"
logback = "1.6.1"
system-lambda = "1.2.1"
testballoon = "1.0.1-K2.4.0"
z3-turnkey = "4.14.1"

[libraries]
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
system-lambda = { module = "com.github.stefanbirkner:system-lambda", version.ref = "system-lambda" }
testballoon = { module = "de.infix.testBalloon:testBalloon-framework-core", version.ref = "testballoon" }
testballoon-kotest-assertions = { module = "de.infix.testBalloon:testBalloon-integration-kotest-assertions", version.ref = "testballoon" }
z3-turnkey = { module = "tools.aqua:z3-turnkey", version.ref = "z3-turnkey" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinx-kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
testballoon = { id = "de.infix.testBalloon", version.ref = "testballoon"}
